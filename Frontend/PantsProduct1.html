<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namona - Pants Product</title>
    <link rel="stylesheet" href="Namona.css">
    <link rel="stylesheet" href="Products.css">
</head>
<body>

<header>
    <button id="menuButton" class="menu-icon">☰</button>
    <img class="midlogo" src="namonalogo.jpg" alt="Namona">

    <div class="profile-container">
        <button class="profile-btn">
            <div class="Profile-pic-wrapper">
                <img src="profpic.jpg" class="Profile-pic" alt="Profile Picture">
            </div>
        </button>
    </div>

    <div id="profileMenu" class="profile-menu">
    <a href="NamonaRegister.html">📝 Register</a>
    <a href="NamonaLogin.html">🔐 Login</a>
    <a href="SavedProducts.html">💾 Saved products</a>
    <a href="MyOrders.html">📦 My orders</a>
    <a href="AboutUs.html">ℹ️ About us</a>
</div>
    <button id="cartButton" class="cart-icon"><img src="carticon-removebg-preview.png" alt="Cart"></button>
</header>

<nav id="sideMenu">
    <a href="Namona.html">Main Page</a>
    <a href="Tshirts.html">T-shirts</a>
    <a href="Hoodies.html">Hoodies</a>
    <a href="Pants.html">Pants</a>
</nav>

<div id="content">
    <button class="back-button" onclick="history.back()">← Back to Pants</button>
    
    <div class="product-detail">
        <div class="product-image">
            <img src="pantsimage.png" alt="Pants Front">
        </div>
        
        <div class="product-info">
            <div class="product-collection">Collection</div>
            <h1>Loading...</h1>
            <div class="product-price">$0.00</div>
            <div class="product-description">
                <p>Loading product details...</p>
            </div>
            
            <div class="size-selector">
                <label><strong>Size:</strong></label>
                <select id="sizeSelect">
                    <option value="" disabled selected>Select size</option>
                    <option value="28">28</option>
                    <option value="30">30</option>
                    <option value="32">32</option>
                    <option value="34">34</option>
                    <option value="36">36</option>
                    <option value="38">38</option>
                </select>
            </div>

            <div class="quantity-selector">
                <label><strong>Quantity:</strong></label>
                <button class="qty-btn" onclick="decreaseQty()">-</button>
                <input type="number" id="quantityInput" value="1" min="1" readonly>
                <button class="qty-btn" onclick="increaseQty()">+</button>
            </div>
            
            <button class="add-to-cart" onclick="addToCartBackend(0)">Add to Cart</button>
            <button class="save-product-btn" id="saveBtn" data-id="0" data-name="Product" data-price="$0.00" data-image="" data-page="" onclick="toggleSaveProduct(this)">â™ˇ Save</button>
            <p id="cartMessage"></p>
        </div>
    </div>
</div>

<script src="Script.js"></script>
<script>
window.addEventListener("DOMContentLoaded", function () {
    loadClothes();
    loadProduct();
});

async function loadClothes() {

    var container = document.getElementById("productsContainer");
    if (!container) return;

    try {

        var response = await fetch(API_URL + "/api/Clothes/AllClothes");
        var clothes = await response.json();

        container.innerHTML = "";

        for (var i = 0; i < clothes.length; i++) {
            var item = clothes[i];

            var card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML =
                '<img src="pantsimage.png">' +
                '<h3>' + item.clothingName + '</h3>' +
                '<p>' + item.categoryName + '</p>' +
                '<p class="price">$' + item.price + '</p>' +
                '<button onclick="openProduct(' + item.clothingId + ')">View Product</button>';

            container.appendChild(card);
        }

    } catch (err) {
    }
}

function openProduct(id) {
    window.location.href = "Product.html?id=" + id;
}

async function loadProduct() {

    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");

    if (!id) return;

    try {

        var response = await fetch(API_URL + "/api/Clothes/AllClothes");
        var clothes = await response.json();

        var product = null;
        for (var i = 0; i < clothes.length; i++) {
            if (clothes[i].clothingId == id) {
                product = clothes[i];
                break;
            }
        }

        if (!product) return;

        var title = document.querySelector(".product-info h1");
        var price = document.querySelector(".product-price");
        var description = document.querySelector(".product-description");

        if (title) title.textContent = product.clothingName;
        if (price) price.textContent = "$" + product.price;

        if (description) {
            description.innerHTML =
                '<p>' + product.collection + '</p>' +
                '<p><strong>Color:</strong> ' + product.color + '</p>' +
                '<p><strong>Size:</strong> ' + product.size + '</p>' +
                '<p><strong>Stock:</strong> ' + product.stock + '</p>';
        }

    } catch (err) {
    }
}

</script>
</body>
</html>
