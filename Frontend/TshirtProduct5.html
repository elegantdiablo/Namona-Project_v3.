<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namona - T-Shirt Product</title>
    <link rel="stylesheet" href="Namona.css">
    <link rel="stylesheet" href="Products.css">
</head>
<body>

<header>
    <button id="menuButton" class="menu-icon">☰</button>
    <img class="midlogo" src="namonalogo.jpg" alt="Namona">

    <div class="profile-container">
        <button class="profile-btn">
            <div class="Profile-pic-wrapper">
                <img src="profpic.jpg" class="Profile-pic" alt="Profile Picture">
            </div>
        </button>
    </div>

    <div id="profileMenu" class="profile-menu">
    <a href="NamonaRegister.html">📝 Register</a>
    <a href="NamonaLogin.html">🔐 Login</a>
    <a href="SavedProducts.html">💾 Saved products</a>
    <a href="MyOrders.html">📦 My orders</a>
    <a href="AboutUs.html">ℹ️ About us</a>
</div>
    <button id="cartButton" class="cart-icon"><img src="carticon-removebg-preview.png" alt="Cart"></button>
</header>

<nav id="sideMenu">
    <a href="Namona.html">Main Page</a>
    <a href="Tshirts.html">T-shirts</a>
    <a href="Hoodies.html">Hoodies</a>
    <a href="Pants.html">Pants</a>
</nav>

<div id="content">
    <button class="back-button" onclick="history.back()">← Back to T-Shirts</button>
    
    <div class="product-detail">
        <div class="product-image">
            <img id="productImg" src="greentshirtfront.png" alt="T-shirt" style="width: 100%; max-width: 500px; border-radius: 8px;">
        </div>
        
        <div class="product-info">
            <div class="product-collection">Collection</div>
            <h1>Loading...</h1>
            <div class="product-price">$0.00</div>
            <div class="product-description">
                <p>Loading product details...</p>
            </div>
            
            <div class="size-selector">
                <label><strong>Size:</strong></label>
                <select id="sizeSelect">
                    <option value="" disabled selected>Select size</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                </select>
            </div>

            <div class="quantity-selector">
                <label><strong>Quantity:</strong></label>
                <button class="qty-btn" onclick="decreaseQty()">-</button>
                <input type="number" id="quantityInput" value="1" min="1" readonly>
                <button class="qty-btn" onclick="increaseQty()">+</button>
            </div>
            
            <button class="add-to-cart" onclick="addToCartBackend(0)">Add to Cart</button>
            <button class="save-product-btn" id="saveBtn" data-id="0" data-name="Product" data-price="$0.00" data-image="" data-page="" onclick="toggleSaveProduct(this)">â™ˇ Save</button>
            <p id="cartMessage"></p>
        </div>
    </div>
</div>

<script src="Script.js"></script>

</body>
</html>
